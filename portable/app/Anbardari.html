<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=9"/>
<meta charset="utf-8"/>
<title>سیستم انبارداری</title>

<style>
  html,body{margin:0;padding:0;font-family:Tahoma,Arial;background:#ECF1F5;color:#1C2024;direction:rtl;}
  .wrap{max-width:920px;margin:0 auto;padding:16px;}
  .brand{background:#1C3A4D;color:#fff;padding:18px 16px;border-radius:4px;}
  .brand h1{margin:0;font-size:28px;}
  .brand p{margin:8px 0 0;color:#D2DEE6;font-size:14px;}
  .grid{display:block;margin-top:18px;}
  button.main{
    display:block;width:100%;margin:0 0 10px;padding:14px 12px;
    font-family:Tahoma;font-size:18px;border:1px solid #0E5252;
    background:#146E6E;color:#fff;cursor:pointer;text-align:center;
  }
  button.sec{
    display:block;width:100%;margin:0 0 10px;padding:12px;
    font-family:Tahoma;font-size:16px;border:1px solid #C6D2DA;
    background:#fff;color:#1C3A4D;cursor:pointer;
  }
  button.danger{background:#A03030;border-color:#7a2020;color:#fff;}
  .panel{background:#fff;border:1px solid #C6D2DA;padding:14px;margin-top:12px;}
  .row{margin-bottom:10px;}
  label{display:block;margin-bottom:4px;font-size:13px;}
  input,select,textarea{
    width:98%;padding:8px;font-family:Tahoma;font-size:14px;
    border:1px solid #C6D2DA;box-sizing:border-box;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid #C6D2DA;padding:6px;text-align:right;}
  th{background:#E8EEF2;}
  .muted{color:#5A6670;font-size:12px;}
  .err{color:#A03030;font-weight:bold;}
  .ok{color:#146E6E;font-weight:bold;}
  .hidden{display:none;}
  .actions button{width:auto;display:inline-block;margin-left:8px;padding:8px 14px;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="view-home">
    <div class="brand">
      <h1>سیستم انبارداری</h1>
      <p>کار با دکمه‌ها — ساده و روزمره</p>
    </div>
    <div class="grid" style="margin-top:16px;">
      <button class="main" onclick="show('in')">ثبت ورود کالا</button>
      <button class="main" onclick="show('out')">ثبت خروج / حواله</button>
      <button class="sec" onclick="show('products')">مدیریت کالاها</button>
      <button class="sec" onclick="show('search')">جستجوی کالا</button>
      <button class="sec" onclick="show('stock')">مشاهده موجودی انبار</button>
      <button class="sec" onclick="show('inout')">گزارش ورود و خروج</button>
      <button class="sec" onclick="show('low')">گزارش کالاهای کم‌موجودی</button>
      <button class="sec danger" onclick="window.close()">خروج از برنامه</button>
    </div>
  </div>

  <div id="view-in" class="hidden"></div>
  <div id="view-out" class="hidden"></div>
  <div id="view-products" class="hidden"></div>
  <div id="view-search" class="hidden"></div>
  <div id="view-stock" class="hidden"></div>
  <div id="view-inout" class="hidden"></div>
  <div id="view-low" class="hidden"></div>
  <div id="view-move" class="hidden"></div>
</div>

<script language="JScript" src="./inventory.js"></script>
<script language="JScript">
window.onload = function(){ App.init(); show('home'); };
function show(name){
  var ids=['home','in','out','products','search','stock','inout','low','move'];
  for(var i=0;i<ids.length;i++){
    document.getElementById('view-'+ids[i]).className = (ids[i]===name)?'':'hidden';
  }
  if(name==='in') App.renderDoc('IN');
  if(name==='out') App.renderDoc('OUT');
  if(name==='products') App.renderProducts();
  if(name==='search') App.renderSearch();
  if(name==='stock') App.renderStock(false);
  if(name==='inout') App.renderInOut();
  if(name==='low') App.renderLow();
  if(name==='move') {}
}
</script>
</body>
</html>
