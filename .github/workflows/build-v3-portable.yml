name: Build v3 Portable (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          ./v3/scripts/Build-Portable-CI.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anbarban-v3-Portable
          path: release/Anbarban-v3-Portable.zip
          retention-days: 90

      - name: Attach to GitHub Release (tag v3.x)
        if: startsWith(github.ref, 'refs/tags/v3.')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Anbarban-v3-Portable.zip
          fail_on_unmatched_files: true

      - name: Attach to latest v3 release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = (gh release list --limit 1 --json tagName -q '.[0].tagName')
          if (-not $tag -or -not $tag.StartsWith('v3.')) { throw "No v3 release tag found" }
          gh release upload $tag release/Anbarban-v3-Portable.zip --clobber
